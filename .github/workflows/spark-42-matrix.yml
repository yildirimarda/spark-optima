# Runs the test suite against PySpark 4.2 (allowed by pyproject.toml:
# pyspark>=4.1.1,<4.3.0) so incompatibilities are caught before a release.
# The pinned version is installed INTO the project venv with `uv pip`, and
# every later step uses `uv run --no-sync`: a plain `uv run` would re-sync the
# environment to uv.lock and silently put the locked PySpark back.

name: Spark 4.2 Matrix

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  spark-42:
    name: Tests (Python 3.12 + PySpark 4.2)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12"]
        pyspark-version: ["4.2.0"]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Install dependencies (force PySpark ${{ matrix.pyspark-version }})
        run: |
          uv sync --frozen
          uv pip install "pyspark==${{ matrix.pyspark-version }}"

      - name: Verify PySpark version
        run: |
          uv run --no-sync python -c "import pyspark; print(pyspark.__version__); assert pyspark.__version__ == '${{ matrix.pyspark-version }}', pyspark.__version__"

      - name: Run unit tests
        run: uv run --no-sync pytest -v --tb=short --cov=src/spark_optima --cov-fail-under=80 --cov-report=xml

      - name: Run Spark 4.2 regression tests
        run: uv run --no-sync pytest tests/unit/test_spark_42_deprecations.py tests/unit/test_pyspark_range.py -v --tb=short
