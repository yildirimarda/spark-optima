{{- if .Values.optimizationJob.enabled }}
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "spark-optima.fullname" . }}-optimization
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "spark-optima.labels" . | nindent 4 }}
    app.kubernetes.io/component: optimization-job
  annotations:
    description: "Spark Optima optimization job — runs with Redis job store"
spec:
  ttlSecondsAfterFinished: {{ .Values.optimizationJob.ttlSecondsAfterFinished }}
  backoffLimit: {{ .Values.optimizationJob.backoffLimit }}
  activeDeadlineSeconds: {{ .Values.optimizationJob.activeDeadlineSeconds }}
  template:
    metadata:
      labels:
        {{- include "spark-optima.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: optimization-job
    spec:
      serviceAccountName: {{ include "spark-optima.cli.serviceAccountName" . }}
      restartPolicy: OnFailure
      securityContext:
        {{- toYaml .Values.api.podSecurityContext | nindent 8 }}
      initContainers:
        - name: init-output
          image: busybox:1.36
          command:
            - sh
            - -c
            - |
              mkdir -p /app/data/results /app/data/results/redis
              chown -R {{ .Values.api.podSecurityContext.runAsUser }}:{{ .Values.api.podSecurityContext.fsGroup }} /app/data
          volumeMounts:
            - name: data
              mountPath: /app/data
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
      containers:
        - name: optimization
          image: {{ include "spark-optima.api.image" . }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command:
            - python
            - -m
            - spark_optima.cli.main
            - optimize
            - --platform
            - {{ .Values.optimizationJob.platform | quote }}
            - --spark-version
            - {{ .Values.optimizationJob.sparkVersion | quote }}
            - --output-format
            - {{ .Values.optimizationJob.outputFormat | quote }}
            - --output
            - "/app/data/results/optimization_result.json"
          envFrom:
            - configMapRef:
                name: {{ include "spark-optima.configMapName" . }}
          env:
            - name: SPARK_OPTIMA_JOB_STORE
              value: "redis"
            - name: SPARK_OPTIMA_REDIS_URL
              value: {{ .Values.optimizationJob.redisUrl | quote }}
            - name: SPARK_OPTIMA_LOG_LEVEL
              value: {{ .Values.config.logLevel | quote }}
            - name: SPARK_OPTIMA_MAX_TRIALS
              value: {{ .Values.optimizationJob.maxTrials | quote }}
            - name: SPARK_OPTIMA_TIMEOUT_MINUTES
              value: {{ .Values.optimizationJob.timeoutMinutes | quote }}
          resources:
            {{- toYaml .Values.optimizationJob.resources | nindent 12 }}
          volumeMounts:
            - name: data
              mountPath: /app/data
            - name: tmp
              mountPath: /tmp
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: false
            capabilities:
              drop:
                - ALL
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: {{ include "spark-optima.pvc.dataName" . }}
        - name: tmp
          emptyDir:
            sizeLimit: 100Mi
{{- end }}
