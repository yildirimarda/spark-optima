# Kubernetes Job manifest for Spark Optima optimization runs.
# This Job runs a single optimization task using the CLI and writes
# results to persistent storage. It is designed to work with the
# Redis-backed job store (SPARK_OPTIMA_JOB_STORE=redis) so that
# job state is shared across API replicas and Job runners.
#
# Platform team usage:
#   1. Set SPARK_OPTIMA_REDIS_URL to your Redis Service endpoint.
#   2. Adjust the platform, spark-version, and resource limits below.
#   3. Apply: kubectl apply -f kubernetes/base/job-optimization.yaml
#
# See kubernetes/PRODUCTION.md and docs/user-guide/k8s-job-runner.md for details.

apiVersion: batch/v1
kind: Job
metadata:
  name: spark-optima-optimization
  namespace: spark-optima
  labels:
    app.kubernetes.io/name: spark-optima
    app.kubernetes.io/component: optimization-job
    app.kubernetes.io/part-of: spark-optima
    app.kubernetes.io/version: "0.1.0"
  annotations:
    description: "Spark Optima optimization job — uses Redis job store for multi-replica visibility"
spec:
  ttlSecondsAfterFinished: 3600
  backoffLimit: 2
  activeDeadlineSeconds: 3600
  template:
    metadata:
      labels:
        app.kubernetes.io/name: spark-optima
        app.kubernetes.io/component: optimization-job
        app.kubernetes.io/part-of: spark-optima
      annotations:
        prometheus.io/scrape: "false"
    spec:
      serviceAccountName: spark-optima-cli
      restartPolicy: OnFailure
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        fsGroup: 1000
      initContainers:
        - name: init-output
          image: busybox:1.36
          command:
            - sh
            - -c
            - |
              mkdir -p /app/data/results
              chown -R 1000:1000 /app/data
          volumeMounts:
            - name: data
              mountPath: /app/data
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
      containers:
        - name: optimization
          image: spark-optima:0.1.0
          imagePullPolicy: IfNotPresent
          command:
            - python
            - -m
            - spark_optima.cli.main
            - optimize
            - --platform
            - "local"
            - --spark-version
            - "3.5.0"
            - --output-format
            - "json"
            - --output
            - "/app/data/results/optimization_result.json"
          envFrom:
            - configMapRef:
                name: spark-optima-config
          env:
            - name: SPARK_OPTIMA_ENV
              value: "production"
            - name: SPARK_OPTIMA_LOG_LEVEL
              value: "INFO"
            # Redis-backed job store for multi-replica deployments.
            - name: SPARK_OPTIMA_JOB_STORE
              value: "redis"
            - name: SPARK_OPTIMA_REDIS_URL
              value: "redis://redis.spark-optima.svc.cluster.local:6379/0"
            - name: SPARK_OPTIMA_MAX_TRIALS
              value: "50"
            - name: SPARK_OPTIMA_TIMEOUT_MINUTES
              value: "30"
          resources:
            requests:
              cpu: 500m
              memory: 1Gi
            limits:
              cpu: 1000m
              memory: 2Gi
          volumeMounts:
            - name: data
              mountPath: /app/data
            - name: tmp
              mountPath: /tmp
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: false
            capabilities:
              drop:
                - ALL
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: spark-optima-data
        - name: tmp
          emptyDir:
            sizeLimit: 100Mi
